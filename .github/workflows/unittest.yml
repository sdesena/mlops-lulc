name: Unittest mlops_lulc

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  Python-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: [ "3.10", "3.11", "3.12", "3.13" ]

    steps:
      - name: checkout
        uses: actions/checkout@v4
     
      - name: Set up MicroMamba and install dependencies with Python ${{ matrix.python-version }}
        uses: mamba-org/setup-micromamba@v1
        with:
          environment-file: environment.yml
          create-args: >-
            python=${{ matrix.python-version }}
      
      - name: Lint with ruff
        run: |
          ruff check

      - name: Run unit tests
        shell: bash -l {0}
        run:
          pytest test/ --cov=xcube_gedidb --cov-report=xml

      - name: Run unit tests
        shell: bash -l {0}
        run: |
          pytest -m "not gaiaflow" --cov=mlops_lulc --cov-branch --cov-report=xml

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v4
        with:
          fail_ci_if_error: true
          verbose: true
          
          token: ${{ secrets.CODECOV_TOKEN }}
          